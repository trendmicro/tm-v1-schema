  DL_Type: string

- Name: requestMethod
  Description_EN: The network protocol request method
  DL_Type: string

- Name: rt
  Description_EN: The Unix time of the log generation
  DL_Type: string

- Name: ruleId
  Description_EN: The rule ID
  DL_Type: int

- Name: ruleIdStr
  Description_EN: The rule ID
  DL_Type: string

- Name: sessionId
  Description_EN: The session ID
  DL_Type: int

- Name: simulation
  Description_EN: Whether a log is a simulation log
  DL_Type: bool

- Name: smbSharedName
  Description_EN: The shared folder name for the server that contains the files to
    be opened
  DL_Type: string

- Name: spt
  Description_EN: The virtual port of the source assigned to the Secure Access Module
    (srcport)
  DL_Type: int

- Name: src
  Description_EN: The source IP address (srcaddr)
  DL_Type: dynamic

- Name: srcFileCreation
  Description_EN: The time when the source file was created (in milliseconds)
  DL_Type: datetime

- Name: srcFileCurrentOwnerName
  Description_EN: The current owner name of the source file
  DL_Type: string

- Name: srcFileCurrentOwnerSid
  Description_EN: The current security identifier owner of the source file
  DL_Type: string

- Name: srcFileDaclString
  Description_EN: The discretionary access control list of the source file
  DL_Type: string

- Name: srcFileGroupName
  Description_EN: The source file user group name
  DL_Type: string

- Name: srcFileGroupSid
  Description_EN: The security identifier of the source file group
  DL_Type: string

- Name: srcFileHash
  Description_EN: The cryptographic hash of the source process image or file, with
    the specific hash algorithm to be determined.
  DL_Type: string

- Name: srcFileHashId
  Description_EN: The source file hash ID
  DL_Type: string

- Name: srcFileHashMd5
  Description_EN: The md5 hash of source file
  DL_Type: string

- Name: srcFileHashSha1
  Description_EN: The SHA-1 of the source file
  DL_Type: string

- Name: srcFileHashSha256
  Description_EN: The SHA-256 of the source file
  DL_Type: string

- Name: srcFileIsRemoteAccess
  Description_EN: The remote access of the source file
  DL_Type: bool

- Name: srcFileModifiedTime
  Description_EN: The time when the source file was modified (in milliseconds)
  DL_Type: datetime

- Name: srcFileOwnerName
  Description_EN: The source file owner name
  DL_Type: string

- Name: srcFileOwnerSid
  Description_EN: The security identifier of the source file owner
  DL_Type: string

- Name: srcFilePath
  Description_EN: The file path which is moved or copied to another path
  DL_Type: string

- Name: srcFileSaclString
  Description_EN: The system access control list of the source file
  DL_Type: string

- Name: srcFileSize
  Description_EN: The file size of the source file
  DL_Type: long

- Name: srcFirstSeen
  Description_EN: The time when the source file first appeared (in milliseconds)
  DL_Type: datetime

- Name: srcHashId
  Description_EN: The source hash ID
  DL_Type: string

- Name: srcLastSeen
  Description_EN: The time when the source file was last seen (in milliseconds)
  DL_Type: datetime

- Name: srcServiceType
  Description_EN: Type of source file
  DL_Type: string

- Name: srcSigner
  Description_EN: The signer of the source file
  DL_Type: dynamic

- Name: srcSignerFlagsAdhoc
  Description_EN: The list of source file signature adhoc flags
  DL_Type: dynamic

- Name: srcSignerFlagsLibValid
  Description_EN: The list of source file signature library validation flags
  DL_Type: dynamic

- Name: srcSignerFlagsRuntime
  Description_EN: The list of source file signature runtime flags
  DL_Type: dynamic

- Name: srcSignerValid
  Description_EN: The validity of the source file signer
  DL_Type: dynamic

- Name: srcSubTrueType
  Description_EN: The true file subtype of the source file
  DL_Type: int

- Name: srcTrueType
  Description_EN: The true file type of the source file
  DL_Type: int

- Name: srcUri
  Description_EN: Path of source file
  DL_Type: string

- Name: srcUser
  Description_EN: The owner name of the source process or the login user name
  DL_Type: string

- Name: status
  Description_EN: The network analysis flow session status
  DL_Type: string

- Name: subnetId
  Description_EN: The subnet ID of the virtual machine that made the request
  DL_Type: string

- Name: subSystem
  Description_EN: The sub system information
  DL_Type: string

- Name: tags
  Description_EN: The attack technique ID detected by Trend Vision One based on the
    alert filter
  DL_Type: dynamic

- Name: timezone
  Description_EN: The host time zone
  DL_Type: string

- Name: userDomain
  Description_EN: Active directory domain, domain of username for logging in TMAS
    adminportal adminportal
  DL_Type: dynamic

- Name: vpcId
  Description_EN: The virtual private cloud that contains the cloud asset
  DL_Type: string

- Name: winEventId
  Description_EN: Event ID of Windows event
  DL_Type: int
