- Name: actionName
  Description_EN: The user or service action
  DL_Type: string

- Name: actResult
  Description_EN: The result of an action
  DL_Type: dynamic

- Name: applicationId
  Description_EN: The Microsoft Entra ID application ID
  DL_Type: string

- Name: attachmentFileHashes
  Description_EN: SHA-1 hash of the email attachment
  DL_Type: dynamic

- Name: attachmentFileHashSha256s
  Description_EN: The SHA-256 hash of the email attachment
  DL_Type: dynamic

- Name: attachmentFileName
  Description_EN: File name of the email attachment
  DL_Type: dynamic

- Name: attachmentFileTlshes
  Description_EN: The TLSH hash detected by Trend Micro Anti-Spam Engine
  DL_Type: dynamic

- Name: attachmentMd5
  Description_EN: The MD5 hash of the email attachment
  DL_Type: dynamic

- Name: attachmentSha1
  Description_EN: SHA-1 hash of the email attachment
  DL_Type: dynamic

- Name: attachmentSha256
  Description_EN: SHA-256 hash of the email attachment
  DL_Type: dynamic

- Name: attachmentSize
  Description_EN: The attachment file size
  DL_Type: dynamic

- Name: attachmentSource
  Description_EN: The attachment source
  DL_Type: dynamic

- Name: attachmentTlsh
  Description_EN: The TLSH hash detected by Trend Micro Anti-Spam Engine
  DL_Type: dynamic

- Name: attachmentUrls
  Description_EN: The URLs and URL sources extracted from the email attachment
  DL_Type: dynamic

- Name: clientIp
  Description_EN: The IP addresses of the source
  DL_Type: dynamic

- Name: cloudStorageId
  Description_EN: The file or folder location ID
  DL_Type: string

- Name: cloudStorageName
  Description_EN: The cloud storage name
  DL_Type: string

- Name: correlationId
  Description_EN: The correlation ID used to associate related telemetry events
  DL_Type: string

- Name: eventId
  Description_EN: The event ID from the logs of each product
  DL_Type: string

- Name: eventName
  Description_EN: The name of the log event
  DL_Type: string

- Name: eventSourceType
  Description_EN: The event source type
  DL_Type: int

- Name: eventSubName
  Description_EN: The Zero Trust Secure Access - Internet Access cloud app action
    or the Palo Alto Networks firewall log sub-type
  DL_Type: string

- Name: eventTime
  Description_EN: The time the identity provider detected the event
  DL_Type: datetime

- Name: extraInfo
  Description_EN: The additional information about the sharing action
  DL_Type: dynamic

- Name: fileExt
  Description_EN: The file extension (If the object is a folder, there is no value
    for this field.)
  DL_Type: string

- Name: fileName
  Description_EN: The name of the file that violated the policy
  DL_Type: dynamic

- Name: filterRiskLevel
  Description_EN: The top level filter risk of the event
  DL_Type: string

- Name: groupId
  Description_EN: The group ID (sae), or the Claude group ID (tlc)
  DL_Type: string

- Name: isExternalAccess
  Description_EN: Whether the cmdlet was run by an external user (True=external user,
    False=internal user in your organization)
  DL_Type: bool

- Name: isSensitiveInfo
  Description_EN: Whether the event contains sensitive information
  DL_Type: bool

- Name: logReceivedTime
  Description_EN: The time when the XDR log was received
  DL_Type: datetime

- Name: mailAttachmentHash
  Description_EN: Hash value of the email attachment
  DL_Type: string

- Name: mailBccAddresses
  Description_EN: Mail BCC address in the email header
  DL_Type: dynamic

- Name: mailbox
  Description_EN: The mailbox that is protected by Trend Micro
  DL_Type: string

- Name: mailCacheId
  Description_EN: The internal email cache ID to identify emails in the same group
    mails
  DL_Type: string

- Name: mailCcAddresses
  Description_EN: Mail CC address in the email header
  DL_Type: dynamic

- Name: mailDirection
  Description_EN: The email traffic direction
  DL_Type: int

- Name: mailEurekaRuleIds
  Description_EN: The list of rule IDs scanned by Eureka and detected by Trend Micro
    Anti-Spam Engine
  DL_Type: dynamic

- Name: mailFeatureId
  Description_EN: The email protocol detected by Trend Micro Anti-Spam Engine
  DL_Type: dynamic

- Name: mailFolder
  Description_EN: The email folder name
  DL_Type: string

- Name: mailFromAddresses
  Description_EN: The Mail From address in the email header
  DL_Type: dynamic

- Name: mailHeaderHash
  Description_EN: The email header hash detected by Trend Micro Anti-Spam Engine
  DL_Type: string

- Name: mailHelo
  Description_EN: The HELO command detected by Trend Micro Anti-Spam Engine
  DL_Type: string

- Name: mailMetaText
  Description_EN: The postman meta text detected by Trend Micro Anti-Spam Engine
  DL_Type: string

- Name: mailMetaTraceId
  Description_EN: The trace ID generated by Trend Micro Feedback Engine
  DL_Type: string

- Name: mailMsgId
  Description_EN: The internet message ID of the email
  DL_Type: string

- Name: mailMsgSubject
  Description_EN: The email subject
  DL_Type: string

- Name: mailReplyToAddresses
  Description_EN: The Reply To address detected by Trend Micro Anti-Spam Engine
  DL_Type: dynamic

- Name: mailReturnPath
  Description_EN: The hidden email header that indicates where bounced messages are
    sent
  DL_Type: dynamic

- Name: mailRuleId
  Description_EN: The rule ID of the matched rule detected by Trend Micro Anti-Spam
    Engine
  DL_Type: dynamic

- Name: mailScore
  Description_EN: The score assigned to the email by Trend Micro Anti-Spam Engine
  DL_Type: long

- Name: mailSenderIp
  Description_EN: Email sender IP address
  DL_Type: string

- Name: mailSmtpFromAddresses
  Description_EN: The envelope address of the sender
  DL_Type: dynamic

- Name: mailSmtpOriginalRecipients
  Description_EN: The envelope addresses of the original recipients
  DL_Type: dynamic

- Name: mailSmtpRecipients
  Description_EN: Email recipients in the SMTP envelope after scanning
  DL_Type: dynamic

- Name: mailSmtpTls
  Description_EN: The SMTP TLS version, for example, TLS 1.2
  DL_Type: string

- Name: mailSourceDomain
  Description_EN: Email domain of the sender
  DL_Type: string

- Name: mailTagHash
  Description_EN: The email tag hash detected by Trend Micro Anti-Spam Engine
  DL_Type: string

- Name: mailTagHashRawSignature
  Description_EN: The raw signature hash of the email
  DL_Type: string

- Name: mailTextHash
  Description_EN: The email text hash detected by Trend Micro Anti-Spam Engine
  DL_Type: string

- Name: mailThreatType
  Description_EN: The type of email detected by Trend Micro Anti-Spam Engine
  DL_Type: string

- Name: mailToAddresses
  Description_EN: The Mail To address in the email header
  DL_Type: dynamic

- Name: mailUrlHash
  Description_EN: The email URL hash detected by Trend Micro Anti-Spam Engine
  DL_Type: string

- Name: mailUrlsOriginalLink
  Description_EN: The original URL extracted from the email content
  DL_Type: dynamic

- Name: mailUrlsRealLink
  Description_EN: The URL extracted from the email content
  DL_Type: dynamic

- Name: mailUrlsVisibleLink
  Description_EN: The URL extracted from the email content
  DL_Type: dynamic

- Name: mailUserAgent
  Description_EN: The user agent
  DL_Type: string

- Name: mailWantedHeaderName
  Description_EN: The WantedHeader key name detected by Trend Micro Anti-Spam Engine
  DL_Type: dynamic

- Name: mailWantedHeaderValue
  Description_EN: The WantedHeader key value detected by Trend Micro Anti-Spam Engine
  DL_Type: dynamic

- Name: mailWholeHeader
  Description_EN: The name and email address of the sender in the From header detected
    by Trend Micro Anti-Spam Engine
  DL_Type: dynamic

- Name: mailXMailer
  Description_EN: The X-Mailer header of the email
  DL_Type: string

- Name: mExternalUid
  Description_EN: The unique ID of the email
  DL_Type: string

- Name: msgUuid
  Description_EN: Internal email UUID to identify each email message
  DL_Type: string

- Name: msgUuidChain
  Description_EN: The internal UUID chain for each email in Trend Micro Feedback Engine
  DL_Type: string

- Name: orgId
  Description_EN: The organization ID
  DL_Type: string

- Name: orgName
  Description_EN: The tenant name
  DL_Type: string

- Name: originatingServer
  Description_EN: The server where the operation originated
  DL_Type: string

- Name: parameters
  Description_EN: The names and values of all parameters used in the cmdlet identified
    in the Operations property
  DL_Type: string

- Name: pname
  Description_EN: The internal product ID (Deprecated, use productCode)
  DL_Type: string

- Name: policyTreePath
  Description_EN: The policy tree path (endpoint only)
  DL_Type: string

- Name: principalName
  Description_EN: The user principal name used to sign in to the proxy
  DL_Type: string

- Name: productCode
  Description_EN: The internal product code of the identity provider (aad=Microsoft
    Entra ID, opa=Microsoft Active Directory)
  DL_Type: string

- Name: recordType
  Description_EN: The operation type
  DL_Type: int

- Name: scanTs
  Description_EN: The time the email was scanned
  DL_Type: datetime

- Name: scanType
  Description_EN: Manual or real-time scan
  DL_Type: string

- Name: service
  Description_EN: The Microsoft 365 service where the activity occurred
  DL_Type: string

- Name: simulation
  Description_EN: Whether a log is a simulation log
  DL_Type: bool

- Name: tags
  Description_EN: The attack technique ID detected by Trend Vision One based on the
    alert filter
  DL_Type: dynamic

- Name: target
  Description_EN: The object accessed by a user or application
  DL_Type: string

- Name: targetType
  Description_EN: The type of object that was accessed or modified
  DL_Type: string

- Name: userAgent
  Description_EN: The user agent or the agent through which the request was made
  DL_Type: string

- Name: userSessionId
  Description_EN: The user session ID
  DL_Type: string

- Name: userType
  Description_EN: The tenant user type
  DL_Type: string
