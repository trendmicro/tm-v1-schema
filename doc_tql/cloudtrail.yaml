- Name: additionalEventData
  Description_EN: The additional event information that was not part of the request
    or response
  DL_Type: dynamic

- Name: apiVersion
  Description_EN: The API version associated with the AwsApiCall eventType value
  DL_Type: string

- Name: awsRegion
  Description_EN: AWS region that the request was made to
  DL_Type: string

- Name: errorCode
  Description_EN: The error code associated with the event
  DL_Type: string

- Name: errorMessage
  Description_EN: Description of the error
  DL_Type: string

- Name: eventCase
  Description_EN: The AWS service that the request was made to
  DL_Type: string

- Name: eventCategory
  Description_EN: The event category used in LookupEvents calls
  DL_Type: string

- Name: eventID
  Description_EN: GUID generated by AWS CloudTrail to identify events
  DL_Type: string

- Name: eventName
  Description_EN: The name of the log event
  DL_Type: string

- Name: eventSource
  Description_EN: The AWS service the request was made to
  DL_Type: string

- Name: eventSubId
  Description_EN: The sub-event ID
  DL_Type: string

- Name: eventTime
  Description_EN: The time the identity provider detected the event
  DL_Type: datetime

- Name: eventType
  Description_EN: The type of event that generated the event record
  DL_Type: string

- Name: eventVersion
  Description_EN: Version of the log event format
  DL_Type: string

- Name: filterRiskLevel
  Description_EN: The top level filter risk of the event
  DL_Type: string

- Name: groupId
  Description_EN: The group ID for the management scope filter
  DL_Type: string

- Name: logReceivedTime
  Description_EN: The time when the XDR log was received
  DL_Type: datetime

- Name: policyTreePath
  Description_EN: The policy tree path (endpoint only)
  DL_Type: string

- Name: productCode
  Description_EN: The internal product code of the identity provider (aad=Microsoft
    Entra ID, opa=Microsoft Active Directory)
  DL_Type: string

- Name: readOnly
  Description_EN: Whether the operation is read-only
  DL_Type: bool

- Name: recipientAccountId
  Description_EN: The Account ID that received the event
  DL_Type: string

- Name: requestID
  Description_EN: Value that identifies the request (The service being called generates
    this value)
  DL_Type: string

- Name: requestParameters
  Description_EN: The parameters, if any, that were sent with the request (Parameters
    are documented in the API reference docs for the appropriate AWS service)
  DL_Type: dynamic

- Name: resources
  Description_EN: List of resources accessed in the event
  DL_Type: dynamic

- Name: responseElements
  Description_EN: Response elements for actions that made changes (create, update,
    or delete actions)
  DL_Type: dynamic

- Name: serviceEventDetails
  Description_EN: The service event (including what triggered the event and the result)
  DL_Type: dynamic

- Name: sharedEventID
  Description_EN: The AWS CloudTrail GUID (from the same AWS action sent to different
    AWS accounts) events (From the same AWS action that is sent to different AWS accounts)
  DL_Type: string

- Name: simulation
  Description_EN: Whether a log is a simulation log
  DL_Type: bool

- Name: sourceIPAddress
  Description_EN: IP address the request was made from (For actions that originate
    from the service console, the address reported is for the underlying customer
    resource, not the console web server. For services in AWS, only the DNS name is
    displayed.)
  DL_Type: string

- Name: tags
  Description_EN: The attack technique ID detected by Trend Vision One based on the
    alert filter
  DL_Type: dynamic

- Name: userAgent
  Description_EN: The user agent or the agent through which the request was made
  DL_Type: string

- Name: userIdentity
  Description_EN: The information about a user who made a request
  DL_Type: dynamic

- Name: vpcEndpointId
  Description_EN: VPC endpoint in which requests were made from a VPC to another AWS
    service (Such as Amazon S3)
  DL_Type: string
