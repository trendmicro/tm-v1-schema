- Name: additionalEventData
  Description_EN: The additional event information that was not part of the 
    request or response
  Sample:
  - '{"SignatureVersion":"SigV4","CipherSuite":"ECDHE-RSA-AES128-GCM-SHA256"}'
  DL_Type: dynamic
- Name: apiVersion
  Description_EN: The API version associated with the AwsApiCall eventType value
  Sample:
  - 2012-08-10
  DL_Type: string
- Name: awsRegion
  Description_EN: AWS region that the request was made to
  Sample:
  - us-east-1
  - us-east-2
  - us-west-1
  DL_Type: string
- Name: errorCode
  Description_EN: The error code associated with the event
  Sample:
  - ThrottlingException
  - InvalidParameterValueException
  - NoSuchLifecycleConfiguration
  DL_Type: string
- Name: errorMessage
  Description_EN: Description of the error
  Sample:
  - The specified bucket does not have a website configuration
  - An unknown error occurred
  - The lifecycle configuration does not exist
  DL_Type: string
- Name: eventCase
  Description_EN: The AWS service that the request was made to
  Sample:
  - workspaces.amazonaws.com
  - sts.amazonaws.com
  - kms.amazonaws.com
  DL_Type: string
- Name: eventCategory
  Description_EN: The event category used in LookupEvents calls
  Sample:
  - Management
  - Data
  - Insight
  DL_Type: string
- Name: eventID
  Description_EN: GUID generated by AWS CloudTrail to identify events
  Sample:
  - 11111111-1111-1111-1111-111111111111
  DL_Type: string
- Name: eventName
  Description_EN: The name of the log event
  Sample:
  - PutObject
  - GetObject
  - DescribeTable
  DL_Type: string
- Name: eventSource
  Description_EN: The AWS service the request was made to
  Sample:
  - s3.amazonaws.com
  - dynamodb.amazonaws.com
  - xray.amazonaws.com
  DL_Type: string
- Name: eventSubId
  Description_EN: The sub-event ID
  Sample:
  - PutObject
  - GetObject
  - DescribeTable
  DL_Type: string
- Name: eventTime
  Description_EN: The time the identity provider detected the event
  Sample:
  - 2022-07-06T22:28:06Z
  DL_Type: datetime
- Name: eventType
  Description_EN: The type of event that generated the event record
  Sample:
  - AwsApiCall
  - AwsServiceEvent
  - AwsConsoleAction
  DL_Type: string
- Name: eventVersion
  Description_EN: Version of the log event format
  Sample:
  - 1.08
  DL_Type: string
- Name: filterRiskLevel
  Description_EN: The top level filter risk of the event
  Sample:
  - info
  - low
  - medium
  DL_Type: string
- Name: groupId
  Description_EN: The group ID for the management scope filter
  Sample:
  - 11111111-1111-1111-1111-111111111111
  DL_Type: string
- Name: logReceivedTime
  Description_EN: The time when the XDR log was received
  Sample:
  - 1656324260000
  DL_Type: datetime
- Name: policyTreePath
  Description_EN: The policy tree path (endpoint only)
  Sample:
  - policyname1/policyname2/policyname3
  DL_Type: string
- Name: productCode
  Description_EN: The internal product code of the identity provider 
    (aad=Microsoft Entra ID, opa=Microsoft Active Directory)
  Sample:
  - sct
  DL_Type: string
- Name: readOnly
  Description_EN: Whether the operation is read-only
  Sample:
  - true
  - false
  DL_Type: bool
- Name: recipientAccountId
  Description_EN: The Account ID that received the event
  Sample:
  - 123456789012
  DL_Type: string
- Name: requestID
  Description_EN: Value that identifies the request (The service being called 
    generates this value)
  Sample:
  - 11111111-1111-1111-1111-111111111111
  DL_Type: string
- Name: requestParameters
  Description_EN: The parameters, if any, that were sent with the request 
    (Parameters are documented in the API reference docs for the appropriate AWS
    service)
  Sample:
  - '{"durationSeconds": 3600, "roleSessionName":"BackplaneAssumeRoleSession"}'
  DL_Type: dynamic
- Name: resources
  Description_EN: List of resources accessed in the event
  Sample:
  - '[{"type":"AWS::S3::Object","ARN":"arn:aws:s3:::your-bucket/file.txt"}]'
  DL_Type: dynamic
- Name: responseElements
  Description_EN: Response elements for actions that made changes (create, 
    update, or delete actions)
  Sample:
  - '{"user":{"createDate":"Mar 24, 2014 9:11:59 PM","userName":"Bob","arn":"arn:aws:iam::123456789012:user/Bob","path":"/","userId":"EXAMPLEUSERID"}}'
  DL_Type: dynamic
- Name: serviceEventDetails
  Description_EN: The service event (including what triggered the event and the 
    result)
  Sample:
  - '{"lifecycleEventPolicy":{"policyVersion":1,"policyId":"11111111-1111-1111-1111-111111111111"}}'
  DL_Type: dynamic
- Name: sharedEventID
  Description_EN: The AWS CloudTrail GUID (from the same AWS action sent to 
    different AWS accounts) events (From the same AWS action that is sent to 
    different AWS accounts)
  Sample:
  - 11111111-1111-1111-1111-111111111111
  DL_Type: string
- Name: simulation
  Description_EN: Whether a log is a simulation log
  Sample:
  - true
  DL_Type: bool
- Name: sourceIPAddress
  Description_EN: IP address the request was made from (For actions that 
    originate from the service console, the address reported is for the 
    underlying customer resource, not the console web server. For services in 
    AWS, only the DNS name is displayed.)
  Sample:
  - 10.10.10.10
  - apigateway.amazonaws.com
  - config.amazonaws.com
  DL_Type: string
- Name: tags
  Description_EN: The attack technique ID detected by Trend Vision One based on 
    the alert filter
  Sample:
  - MITREV9.T1090
  - MITRE.T1059
  - MITREV9.T1059.001
  DL_Type: dynamic
- Name: userAgent
  Description_EN: The user agent or the agent through which the request was made
  Sample:
  - signin.amazonaws.com
  - console.amazonaws.com
  - aws-cli/1.3.23 Python/2.7.6 Linux/2.6.18-164.el5
  DL_Type: string
- Name: userIdentity
  Description_EN: The information about a user who made a request
  Sample:
  - '{"type":"AWSService","invokedBy":"apigateway.amazonaws.com"}'
  - '{"type":"AWSService","invokedBy":"lambda.amazonaws.com"}'
  DL_Type: dynamic
- Name: vpcEndpointId
  Description_EN: VPC endpoint in which requests were made from a VPC to another
    AWS service (Such as Amazon S3)
  Sample:
  - vpce-00000000000000000
  DL_Type: string
